[package]
name = "webcraft-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "webcraft-server"
path = "src/main.rs"

[dependencies]
webcraft-common = { path = "../common" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
