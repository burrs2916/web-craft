<section class="wc-block wc-block-video wc-container" {% if block.id %}id="{{ block.id }}"{% endif %}>
  {% if block.heading %}<h2 class="wc-block-video__heading">{{ block.heading }}</h2>{% endif %}
  <div class="wc-block-video__wrapper">
    {% if block.embed_url %}
    <iframe src="{{ block.embed_url | safe }}" frameborder="0" allowfullscreen
            style="position:absolute;top:0;left:0;width:100%;height:100%"></iframe>
    {% endif %}
  </div>
</section>
