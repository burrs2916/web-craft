{% extends "base.html" %}
{% block title %}归档 - {{ site.name }}{% endblock title %}
{% block content %}
<section class="docs-archive">
  <h1 class="docs-h1">归档</h1>
  {% for year, months in archive %}
  <h2 class="docs-h2">{{ year }}</h2>
  <ul class="docs-list">
    {% for m in months %}
    <li><a href="/archive/{{ year }}/{{ m.month }}/index.html">{{ m.month }} 月</a> ({{ m.count }})</li>
    {% endfor %}
  </ul>
  {% endfor %}
</section>
{% endblock content %}
