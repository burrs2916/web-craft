<aside class="docs-sidebar">
  <div class="sidebar-brand">
    <a href="/" class="site-brand">
      {% if settings.logo_url %}
        <img class="brand-logo" src="{{ settings.logo_url }}" alt="{{ site.name }}">
      {% else %}
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 18 L8 6 L12 15 L16 6 L20 18"/>
        </svg>
      </span>
      {% endif %}
      <span class="site-title">{{ site.name }}</span>
    </a>
    {% if settings.show_tagline and settings.tagline %}<span class="site-tagline">{{ settings.tagline }}</span>{% endif %}
  </div>
  <nav class="docs-nav">
    <a href="/" class="nav-link">首页</a>
    <a href="/archive/index.html" class="nav-link">归档</a>
    <a href="/tags/index.html" class="nav-link">标签</a>
  </nav>
</aside>
